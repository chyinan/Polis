[package]
name = "polis-desktop"
version = "0.7.0"
description = "Polis Windows desktop host"
authors = ["Polis"]
edition = "2021"

[lib]
name = "polis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["fileapi", "handleapi", "jobapi2", "processthreadsapi", "winbase", "winnt", "winreg"] }
